version: "3.8"

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    
    # ← RIMUOVI network_mode: host
    # Aggiungi porte esplicite
    ports:
      - 51820:51820/udp  # WireGuard UDP
      
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    volumes:
      - ./wg-config:/config
      - /lib/modules:/lib/modules:ro

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - SERVERURL=vpn.ma77yz.uk
      - SERVERPORT=51820
      - PEERS=phone,pc
      - PEERDNS=1.1.1.1
      - INTERNAL_SUBNET=10.13.13.0  # Ora funziona!

    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1