version: "3.8"

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped

    # WireGuard esposto direttamente sull'host (consigliato)
    network_mode: host

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    volumes:
      - ./wg-config:/config
      - /lib/modules:/lib/modules:ro

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome

      # Hostname pubblico con cui i client raggiungono la VPN
      - SERVERURL=vpn.ma77yz.uk
      - SERVERPORT=51820

      # Opzionali (decommenta se ti servono)
      - PEERS=phone,pc
      - PEERDNS=1.1.1.1
      - INTERNAL_SUBNET=10.13.13.0  # <- Questa risolve tutto
      # - ALLOWEDIPS=0.0.0.0/0, ::/0
      # - INTERNAL_SUBNET=10.13.13.0

    # DNS usato *dal container* per risolvere nomi (non è il DNS che dai ai client).
    # Se vpn.ma77yz.uk NON è un vero DNS resolver, rimuovi questa sezione.
